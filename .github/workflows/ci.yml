name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      # C35: full history. A depth-1 clone has one commit, so `git merge-base --is-ancestor` can only ever see
      # HEAD, the forbidden-word scan over `git log` sees exactly one message, and the ancestry tests fail for
      # every sha — which is what turned every run on this branch red while the same tests passed locally.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core deps must be empty; dev extras only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,capture,capture-sdks]"
      # C27: every step that can fail goes through tools/ci_summary.py, so the run Summary page (readable
      # without a login) carries the tail of the failure instead of hiding it behind the job log.
      - name: Guard rails (stdlib-only core, no egress)
        run: python tools/ci_summary.py --title "${{ matrix.python }} / ${{ matrix.os }} · guard rails" -- python -m pytest tests/test_stdlib_only.py tests/test_no_egress.py tests/test_platform_dispatch.py -q -rfE --tb=short
      - name: Unit + property tests
        # A hung test used to be a six-hour wait with a log nobody could read: the 3.12 cells sat in this step while
        # 3.11 and 3.13 finished in three minutes, and the only way to learn which test it was would have been to
        # guess. `faulthandler_timeout` dumps every thread's stack once a test exceeds the bound, and
        # `timeout-minutes` turns the hang into a red cell that names itself.
        #
        # The budget was 15 minutes until 2026-11-16, when 940577a's Windows cells began to *time out* rather than fail:
        # py3.13 finished in 14.6 and 13.2 minutes (it fitted, barely) while py3.11 and py3.12 were killed at the bound.
        # The suite had grown from 1 414 to 1 531 tests, and the new ones are subprocess-heavy by design — a runtime
        # netguard that runs the CLI, a concurrency test that starts six recoverers, a CLI contract that checks exit codes
        # by invoking them. Linux runs the whole thing in ~7.6 minutes here; Windows is roughly twice that. 30 minutes is
        # headroom for the slowest runner, not a licence: a *hung* test still reports itself through
        # `faulthandler_timeout` long before this bound (defect 102).
        timeout-minutes: 30
        # `-s`: the run's evidence has to survive the process, and a captured stdout is a buffer that `os._exit` never
        # flushes (the watchdog exits that way by design). Fixture-level `capfd`/`capsys` tests do their own capture.
        run: python tools/ci_summary.py --title "${{ matrix.python }} / ${{ matrix.os }} · unit + property" -- python -m pytest -q -rfE --tb=short -s
      - name: Crash stages S1-S5 + a 20-trial kill smoke run (POSIX only)
        if: runner.os != 'Windows'
        # `tests/kill/` holds drivers, not test modules, so `pytest tests/kill` collected nothing and exited 5.
        # The stages live in tests/test_crash_points.py; the matrix is a script whose smoke run is 20 trials.
        run: |
          python tools/ci_summary.py --title "${{ matrix.python }} / ${{ matrix.os }} · crash stages" -- python -m pytest tests/test_crash_points.py -q -rfE --tb=short
          python tools/ci_summary.py --title "${{ matrix.python }} / ${{ matrix.os }} · kill smoke" -- python tests/kill/kill_matrix.py --trials 20
      - name: Packaging check
        run: python tools/ci_summary.py --title "${{ matrix.python }} / ${{ matrix.os }} · packaging" -- python -m pytest tests/test_packaging.py -q -rfE --tb=short

  docs:
    runs-on: ubuntu-latest
    steps:
      # C35: full history. A depth-1 clone has one commit, so `git merge-base --is-ancestor` can only ever see
      # HEAD, the forbidden-word scan over `git log` sees exactly one message, and the ancestry tests fail for
      # every sha — which is what turned every run on this branch red while the same tests passed locally.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev extras (this job needs pytest)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,capture,capture-sdks]"
      - name: Docs cross-references and table integrity
        run: python tools/ci_summary.py --title "docs" -- python -m pytest tests/test_docs_links.py -q -rfE --tb=short

  # P11-15: the Go reader is written and reviewed on a machine with no Go toolchain, so this job is the only place it is
  # ever compiled and run. It builds the reader, reproduces the CRC-32 conformance vectors, verifies a real capsule
  # written by the Python implementation, and expects the three named refusals. A red cell here means the document is not
  # enough to read a capsule — which is the question the row exists to answer.
  go-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Install the Python implementation (used to WRITE the capsule the Go reader READS)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,capture,capture-sdks]"
      - name: Build, verify a capsule, and check the three refusals
        run: python tools/ci_summary.py --title "go-reader · bbx-read selftest" -- sh tools/readers/go/selftest.sh
