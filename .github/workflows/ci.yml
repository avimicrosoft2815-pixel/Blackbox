name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core deps must be empty; dev extras only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Guard rails (stdlib-only core, no egress)
        run: python -m pytest tests/test_stdlib_only.py tests/test_no_egress.py -q
      - name: Unit + property tests
        run: python -m pytest -q
      - name: Crash stages S1-S5 + a 20-trial kill smoke run (POSIX only)
        if: runner.os != 'Windows'
        # `tests/kill/` holds drivers, not test modules, so `pytest tests/kill` collected nothing and exited 5.
        # The stages live in tests/test_crash_points.py; the matrix is a script whose smoke run is 20 trials.
        run: |
          python -m pytest tests/test_crash_points.py -q
          python tests/kill/kill_matrix.py --trials 20
      - name: Packaging check
        run: python -m pytest tests/test_packaging.py -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev extras (this job needs pytest)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Docs cross-references and table integrity
        run: python -m pytest tests/test_docs_links.py -q
