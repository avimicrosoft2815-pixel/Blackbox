name: diag-windows
on:
  push:
    branches: ["**"]
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,capture,capture-sdks]"
      - name: changed files only
        run: |
          python -m pytest tests/test_rebind_probe.py tests/test_proxy_supervisor.py -q -rfE --tb=long -s > diag-changed.txt 2>&1
          echo "exit=$LASTEXITCODE"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: diag-changed
          path: diag-changed.txt
