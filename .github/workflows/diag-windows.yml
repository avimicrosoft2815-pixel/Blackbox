name: diag-windows
on:
  push:
    branches: ["**"]
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,capture,capture-sdks]"
      # Blob storage (job logs, artifacts) is not reachable from where this is read, so the only surviving channel is
      # the ANNOTATION stream: this step turns the run's own output into `::error::` lines, chunked to 550 chars.
      - name: full suite, annotated
        shell: bash
        run: |
          set +e
          python -m pytest -q -rfE --tb=line -s > diag-full.txt 2>&1
          echo "pytest exit=$?"
          python - <<'PY'
          import re, pathlib
          text = pathlib.Path("diag-full.txt").read_text(errors="replace")
          lines = text.splitlines()
          keep = [l for l in lines if re.match(r"^(FAILED|ERROR|INTERNALERROR|E\s|={3,})", l)]
          keep += [l for l in lines[-6:]]
          blob = "\n".join(dict.fromkeys(keep)) or text[-2000:]
          for i in range(0, len(blob), 550):
              print(f"::error title=win{i//550}::{blob[i:i+550]}", flush=True)
          PY
          exit 0
